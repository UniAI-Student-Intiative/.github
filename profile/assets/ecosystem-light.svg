<text x="510" y="273" font-size="14" fill="#4D515C" font-weight="400" >Find your team.</text>
<text x="510" y="294" font-size="14" fill="#4D515C" font-weight="400" >Make an idea work.</text>
<path d="M510 317h180" stroke="#DEDDE5"/><text x="510" y="347" font-size="11" fill="#4D515C" font-weight="400" class="mono" >Challenges / prototypes</text>
