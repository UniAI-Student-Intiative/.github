<text x="50" y="244" font-size="18" fill="#15161B" font-weight="700" >AI &amp; research</text>
<text x="50" y="273" font-size="14" fill="#4D515C" font-weight="400" >Reproduce. Question.</text>
<text x="50" y="294" font-size="14" fill="#4D515C" font-weight="400" >Build in the open.</text>
<path d="M50 317h180" stroke="#DEDDE5"/><text x="50" y="347" font-size="11" fill="#4D515C" font-weight="400" class="mono" >Papers / experiments</text>
<text x="50" y="371" font-size="11" fill="#4D515C" font-weight="400" class="mono" >Models / evaluation</text>
