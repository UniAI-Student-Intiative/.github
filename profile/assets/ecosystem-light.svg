<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc" fill="none">
<title id="title">UniAI ecosystem map</title><desc id="desc">Five connected departments: open-source AI and research, workshops and bootcamps, hackathons and competitions, platform engineering, community and partnerships. Animated paths show the exchange of ideas, not live activity.</desc>
<defs><linearGradient id="signal" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#F7941D"/><stop offset="1" stop-color="#A04EDB"/></linearGradient><pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".65" fill="#4D515C" opacity=".13"/></pattern></defs>
<style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',monospace}.flow{stroke-dasharray:4 16;animation:signal 12s linear infinite}.breath{animation:breathe 5s ease-in-out infinite}.delay{animation-delay:-2.5s}.cursor{animation:cursor 2.4s steps(2,end) infinite}@keyframes signal{to{stroke-dashoffset:-200}}@keyframes breathe{0%,100%{opacity:.45}50%{opacity:1}}@keyframes cursor{0%,70%{opacity:1}71%,100%{opacity:0}}@media(prefers-reduced-motion:reduce){.flow,.breath,.cursor{animation:none}}</style>
<rect x=".5" y=".5" width="1199" height="469" rx="20" fill="#F6F6F4" stroke="#DEDDE5"/>
<rect x="1" y="1" width="1198" height="468" rx="20" fill="url(#dots)"/>
<text x="32" y="35" font-size="11" fill="#4D515C" font-weight="400" class="mono" letter-spacing="1.8">UNIAI / ECOSYSTEM MAP</text>
<text x="32" y="74" font-size="29" fill="#15161B" font-weight="700" >Different disciplines. Shared curiosity.</text>
<text x="1168" y="35" font-size="10" fill="#4D515C" font-weight="400" class="mono" text-anchor="end">[ 5 PILLARS / 1 COMMUNITY ]</text>
