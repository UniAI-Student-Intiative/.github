<path d="M740 317h180" stroke="#DEDDE5"/><text x="740" y="347" font-size="11" fill="#4D515C" font-weight="400" class="mono" >Events / platforms</text>
<text x="740" y="371" font-size="11" fill="#4D515C" font-weight="400" class="mono" >Reliability / access</text>
<path d="M1057 125v32" stroke="#F7941D" opacity=".5"/><circle class="breath " cx="1057" cy="125" r="4" fill="#F7941D"/><rect x="952" y="158" width="216" height="252" rx="12" fill="#FFFFFF" stroke="#DEDDE5"/><path d="M968 158h38" stroke="#F7941D" stroke-width="2"/><g transform="translate(970 179)" stroke="#F7941D" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="16" cy="8" r="5"/><circle cx="4" cy="15" r="3"/><circle cx="28" cy="15" r="3"/><path d="M7 31v-5c0-6 3-9 9-9s9 3 9 9v5M1 31v-6c0-3 2-5 6-5M31 31v-6c0-3-2-5-6-5"/></g><text x="1146" y="194" font-size="12" fill="#4D515C" font-weight="400" class="mono" text-anchor="end">05</text>
<text x="970" y="244" font-size="18" fill="#15161B" font-weight="700" >Community</text>
<text x="970" y="273" font-size="14" fill="#4D515C" font-weight="400" >Connect people</text>
<text x="970" y="294" font-size="14" fill="#4D515C" font-weight="400" >and possibilities.</text>
<path d="M970 317h180" stroke="#DEDDE5"/><text x="970" y="347" font-size="11" fill="#4D515C" font-weight="400" class="mono" >PR / partnerships</text>
<text x="970" y="371" font-size="11" fill="#4D515C" font-weight="400" class="mono" >Membership / outreach</text>
<text x="32" y="445" font-size="11" fill="#4D515C" font-weight="400" class="mono" >ideas -&gt; experiments -&gt; shared knowledge</text>
