<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" fill="none" role="img" aria-labelledby="title description">
  <title id="title">UniAI | Learn. Build. Connect.</title>
  <desc id="description">University AI Student Organisation. Orange and purple neural connections on a dark grid. Student-led research, practical engineering and community innovation. Season 2026 to 2027.</desc>
  <defs>
    <linearGradient id="accent" x1="40" y1="0" x2="1160" y2="320" gradientUnits="userSpaceOnUse"><stop stop-color="#F7941D"/><stop offset="1" stop-color="#A04EDB"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#A04EDB" stop-opacity=".18"/><stop offset="1" stop-color="#A04EDB" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" stroke="#26262C" stroke-width="1"/></pattern>
    <clipPath id="frame"><rect x="1" y="1" width="1198" height="318" rx="22"/></clipPath>
  </defs>
  <style>
    text{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',monospace}
    .grid{animation:drift 18s linear infinite}
    .halo{transform-origin:960px 160px;animation:breathe 8s ease-in-out infinite}
    .network{animation:signal 10s linear infinite;stroke-dasharray:6 10}
    .node{animation:pulse 5s ease-in-out infinite}
    .n1{animation-delay:-1.25s}.n2{animation-delay:-2.5s}.n3{animation-delay:-3.75s}
    @keyframes drift{from{transform:translate(0,0)}to{transform:translate(40px,40px)}}
    @keyframes breathe{0%,100%{opacity:.6;transform:scale(.94)}50%{opacity:1;transform:scale(1.06)}}
    @keyframes signal{to{stroke-dashoffset:-160}}
    @keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
    @media(prefers-reduced-motion:reduce){.grid,.halo,.network,.node{animation:none}}
  </style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="#0B0B0D"/>
    <g class="grid"><rect x="-40" y="-40" width="1280" height="400" fill="url(#grid)" opacity=".55"/></g>
    <ellipse class="halo" cx="960" cy="160" rx="290" ry="250" fill="url(#halo)"/>
    <path d="M40 1H1160" stroke="url(#accent)" stroke-width="3"/>
    <rect x="48" y="38" width="216" height="26" rx="13" fill="#0B0B0D" stroke="#26262C"/>
    <circle cx="64" cy="51" r="3" fill="#F7941D"/>
    <text x="77" y="55" fill="#B6B6C1" font-size="10" letter-spacing="1.4" class="mono">STUDENT-LED / AI-DRIVEN</text>
    <text x="44" y="155" fill="#F6F6F4" font-size="94" font-weight="800" letter-spacing="-5">Uni<tspan fill="#F7941D">AI</tspan></text>
    <text x="49" y="192" fill="#F6F6F4" font-size="21" font-weight="600" letter-spacing=".3">Learn. Build. Connect.</text>
    <text x="49" y="224" fill="#B6B6C1" font-size="14">Bridging research, engineering and community innovation.</text>
    <path d="M49 254H93" stroke="url(#accent)" stroke-width="3"/>
    <text x="105" y="258" fill="#B6B6C1" font-size="11" letter-spacing="1.1" class="mono">UNIVERSITY AI STUDENT ORGANISATION</text>
