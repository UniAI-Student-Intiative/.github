<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="12" viewBox="0 0 1200 12" fill="none" role="img" aria-labelledby="title description"><title id="title">UniAI signal divider</title><desc id="description">An orange and purple line with a slow travelling signal and a static reduced-motion state.</desc><defs><linearGradient id="line" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#F7941D" stop-opacity="0"/><stop offset=".3" stop-color="#F7941D"/><stop offset=".7" stop-color="#A04EDB"/><stop offset="1" stop-color="#A04EDB" stop-opacity="0"/></linearGradient></defs><style>.signal{stroke-dasharray:24 1176;animation:signal 9s linear infinite}@keyframes signal{to{stroke-dashoffset:-1200}}@media(prefers-reduced-motion:reduce){.signal{animation:none;stroke-dasharray:none;opacity:.35}}</style><path d="M0 6H1200" stroke="url(#line)" stroke-width="1" opacity=".45"/><path class="signal" d="M0 6H1200" stroke="url(#line)" stroke-width="3"/></svg>
