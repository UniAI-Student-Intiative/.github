<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="12" viewBox="0 0 1200 12" fill="none" role="img" aria-labelledby="title description">
<title id="title">UniAI section divider</title>
<desc id="description">An orange and purple gradient line with a gently travelling pulse.</desc>
<defs>
<linearGradient id="line" x1="0" y1="6" x2="1200" y2="6" gradientUnits="userSpaceOnUse"><stop stop-color="#F7941D" stop-opacity="0"/><stop offset=".3" stop-color="#F7941D"/><stop offset=".7" stop-color="#A04EDB"/><stop offset="1" stop-color="#A04EDB" stop-opacity="0"/></linearGradient>
<linearGradient id="pulse" x1="-120" y1="0" x2="120" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#F7941D" stop-opacity="0"/><stop offset=".5" stop-color="#F7941D"/><stop offset="1" stop-color="#A04EDB" stop-opacity="0"/></linearGradient>
</defs>
<style>.pulse{animation:travel 7s ease-in-out infinite}@keyframes travel{0%{transform:translateX(0);opacity:0}15%,85%{opacity:1}100%{transform:translateX(1200px);opacity:0}}@media(prefers-reduced-motion:reduce){.pulse{animation:none;transform:translateX(600px);opacity:.7}}</style>
<path d="M0 6H1200" stroke="url(#line)" stroke-width="1" opacity=".5"/>
<g class="pulse"><path d="M-120 6H120" stroke="url(#pulse)" stroke-width="6" opacity=".1"/><path d="M-120 6H120" stroke="url(#pulse)" stroke-width="2"/></g>
</svg>
