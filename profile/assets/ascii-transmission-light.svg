<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="290" viewBox="0 0 1200 290" fill="none" role="img" aria-labelledby="title description">
<title id="title">An idea becomes a conversation</title>
<desc id="description">Illustrative AI exchange, not a live chatbot. Student: How do we turn an idea into something real? UniAI: Ask a question. Build an experiment. Share what you learn. The prompt, processing dots and example response animate in a sixteen-second loop.</desc>
<defs>
<linearGradient id="thread" x1="48" y1="45" x2="48" y2="245" gradientUnits="userSpaceOnUse"><stop stop-color="#F7941D"/><stop offset="1" stop-color="#A04EDB"/></linearGradient>
<linearGradient id="signal" x1="90" y1="0" x2="1128" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#F7941D" stop-opacity="0"/><stop offset=".4" stop-color="#F7941D"/><stop offset=".7" stop-color="#A04EDB"/><stop offset="1" stop-color="#A04EDB" stop-opacity="0"/></linearGradient>
<clipPath id="prompt-clip"><rect class="prompt-mask" x="90" y="57" width="1060" height="41"/></clipPath>
<clipPath id="reply-clip"><rect class="reply-mask" x="90" y="187" width="1060" height="69"/></clipPath>
</defs>
<style>
text{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',monospace}
.prompt-mask{transform-origin:90px 0;animation:prompt-type 16s steps(42,end) infinite}
.reply-mask{transform-origin:90px 0;animation:reply-type 16s steps(64,end) infinite}
.content{animation:cycle 16s ease-in-out infinite}
.dot{animation:think 2.4s ease-in-out infinite}
.d2{animation-delay:.3s}.d3{animation-delay:.6s}
.signal{stroke-dasharray:3 15;animation:signal 8s linear infinite}
.avatar{transform-origin:48px 211px;animation:avatar 16s ease-in-out infinite}
@keyframes prompt-type{0%{transform:scaleX(0)}10%,100%{transform:scaleX(1)}}
@keyframes reply-type{0%,20%{transform:scaleX(0)}39%,100%{transform:scaleX(1)}}
@keyframes cycle{0%,97%,100%{opacity:0}3%,94%{opacity:1}}
@keyframes think{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:.9;transform:translateY(-2px)}}
@keyframes signal{to{stroke-dashoffset:-144}}
@keyframes avatar{0%,20%,100%{opacity:.65}35%,90%{opacity:1}}
@media(prefers-reduced-motion:reduce){.prompt-mask,.reply-mask,.content,.dot,.signal,.avatar{animation:none;transform:none;opacity:1}}
</style>
<rect width="1200" height="290" fill="#FFFFFF"/>
<text class="mono" x="32" y="26" fill="#4D515C" font-size="10" letter-spacing="1.7">ILLUSTRATIVE AI EXCHANGE</text>
<path d="M32 40H1168" stroke="url(#signal)" stroke-width="1" opacity=".35"/>
<path d="M48 72V211" stroke="url(#thread)" stroke-width="1" opacity=".35"/>
<path d="M42 69l7 6-7 6M52 81h7" stroke="#F7941D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text class="mono" x="90" y="57" fill="#8F4F09" font-size="10" letter-spacing="1.2">STUDENT / A FIRST QUESTION</text>
<g class="content"><g clip-path="url(#prompt-clip)"><text x="90" y="88" fill="#15161B" font-size="23" font-weight="500">How do we turn an idea into something real?</text></g></g>
<g aria-hidden="true">
<path class="signal" d="M90 139H1145" stroke="url(#signal)" stroke-width="1" opacity=".24"/>
<text class="mono" x="90" y="144" fill="#4D515C" font-size="13">[ ? ]</text>
<text class="mono" x="181" y="144" fill="#6C2F9B" font-size="13">[</text>
<circle class="dot" cx="205" cy="139" r="2.3" fill="#6C2F9B"/>
<circle class="dot d2" cx="219" cy="139" r="2.3" fill="#6C2F9B"/>
<circle class="dot d3" cx="233" cy="139" r="2.3" fill="#6C2F9B"/>
<text class="mono" x="251" y="144" fill="#6C2F9B" font-size="13">]</text>
<text class="mono" x="308" y="144" fill="#4D515C" font-size="13">[ + ]</text>
<text class="mono" x="1145" y="144" fill="#4D515C" font-size="10" text-anchor="end" letter-spacing=".7">QUESTION -&gt; EXPERIMENT -&gt; KNOWLEDGE</text>
</g>
<g class="avatar" stroke="#6C2F9B" stroke-width="1.5" stroke-linejoin="round">
<path d="M48 196l14 10-5 17H39l-5-17z"/>
<path d="M48 203l7 5-3 8h-8l-3-8zM48 196v7M62 206l-7 2M57 223l-5-7M39 223l5-7M34 206l7 2"/>
</g>
<text class="mono" x="90" y="184" fill="#6C2F9B" font-size="10" letter-spacing="1.2">UNIAI / AN EXAMPLE RESPONSE</text>
<g class="content"><g clip-path="url(#reply-clip)">
<text x="90" y="216" fill="#15161B" font-size="23" font-weight="600">Ask a question. Build an experiment.</text>
<text x="90" y="246" fill="#15161B" font-size="23" font-weight="600">Share what you learn.</text>
</g></g>
<text class="mono" x="1168" y="278" text-anchor="end" fill="#4D515C" font-size="9" letter-spacing="1">A CONVERSATION ILLUSTRATION / NO LIVE MODEL</text>
</svg>
