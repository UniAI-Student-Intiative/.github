<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="180" viewBox="0 0 1200 180" role="img" aria-labelledby="title desc"><title id="title">Keep exploring together</title><desc id="desc">Decorative ASCII satellite and spacecraft orbit the UniAI name. A terminal line types keep exploring together. This is a looping illustration, not live telemetry or a clock.</desc><defs><clipPath id="typing"><rect class="reveal" x="650" y="89" width="470" height="30"/></clipPath></defs><style>text{font-family:ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',monospace}.ship{animation:ascii-flight 24s linear infinite;animation-delay:-3s}.sat{animation:ascii-relay 35s linear infinite;animation-delay:-12s}.reveal{animation:type 12s steps(28,end) infinite;transform-origin:650px 0}.cursor{animation:blink 1.2s steps(2,end) infinite}@keyframes ascii-flight{0.0%{transform:translate(170.00px,0.00px)}6.25%{transform:translate(157.06px,21.43px)}12.5%{transform:translate(120.21px,39.60px)}18.75%{transform:translate(65.06px,51.74px)}25.0%{transform:translate(0.00px,56.00px)}31.25%{transform:translate(-65.06px,51.74px)}37.5%{transform:translate(-120.21px,39.60px)}43.75%{transform:translate(-157.06px,21.43px)}50.0%{transform:translate(-170.00px,0.00px)}56.25%{transform:translate(-157.06px,-21.43px)}62.5%{transform:translate(-120.21px,-39.60px)}68.75%{transform:translate(-65.06px,-51.74px)}75.0%{transform:translate(-0.00px,-56.00px)}81.25%{transform:translate(65.06px,-51.74px)}87.5%{transform:translate(120.21px,-39.60px)}93.75%{transform:translate(157.06px,-21.43px)}100.0%{transform:translate(170.00px,-0.00px)}}@keyframes ascii-relay{0.0%{transform:translate(-31.81px,44.80px)}6.25%{transform:translate(-81.56px,37.39px)}12.5%{transform:translate(-118.90px,24.29px)}18.75%{transform:translate(-138.13px,7.49px)}25.0%{transform:translate(-136.34px,-10.45px)}31.25%{transform:translate(-113.79px,-26.80px)}37.5%{transform:translate(-73.91px,-39.07px)}43.75%{transform:translate(-22.79px,-45.39px)}50.0%{transform:translate(31.81px,-44.80px)}56.25%{transform:translate(81.56px,-37.39px)}62.5%{transform:translate(118.90px,-24.29px)}68.75%{transform:translate(138.13px,-7.49px)}75.0%{transform:translate(136.34px,10.45px)}81.25%{transform:translate(113.79px,26.80px)}87.5%{transform:translate(73.91px,39.07px)}93.75%{transform:translate(22.79px,45.39px)}100.0%{transform:translate(-31.81px,44.80px)}}@keyframes type{0%,8%{transform:scaleX(0)}42%,92%{transform:scaleX(1)}100%{transform:scaleX(0)}}@keyframes blink{50%{opacity:0}}@media(prefers-reduced-motion:reduce){.ship,.sat,.reveal,.cursor{animation:none}}</style><rect width="1200" height="180" fill="#0D1117"/><g fill="none" stroke="#A04EDB" opacity=".25"><ellipse cx="300" cy="90" rx="170" ry="56"/><path d="M520 34v112"/></g><text x="249" y="97" font-size="20" fill="#F6F6F4">[ UniAI ]</text><g transform="translate(300 90)"><g class="ship"><text x="-18" y="6" font-size="17" fill="#F7941D">&gt;=&gt;</text></g><g class="sat"><text x="-18" y="5" font-size="14" fill="#A04EDB">[::]</text></g></g><text x="650" y="63" font-size="11" letter-spacing="2" fill="#B6B6C1">TRANSMISSION / NEXT DISCOVERY</text><g clip-path="url(#typing)"><text x="650" y="111" font-size="19" fill="#F6F6F4">&gt; keep_exploring --together</text></g><text class="cursor" x="1000" y="113" fill="#F7941D" font-size="20">_</text><text x="650" y="144" fill="#B6B6C1" font-size="11">question -&gt; experiment -&gt; discovery</text></svg>
