<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" fill="none" role="img" aria-labelledby="title description">
<title id="title">UniAI mission and identity</title>
<desc id="description">University AI Student Organization. A place to learn together and build something that matters. UniAI is a student-led AI initiative in Greece, connecting academic research, practical AI engineering and community innovation. We bring students from different universities and disciplines into a shared space for experiments, hands-on learning and collaboration with researchers and industry. Curiosity is the starting point. Reproducible work, useful tools and knowledge shared with the next student are how we turn it into progress. The custom ASCII signal pipeline moves from ASK to THINK to CONNECT to CREATE, illustrating how shared curiosity becomes useful ideas.</desc>
<defs><linearGradient id="signal" x1="32" y1="0" x2="1168" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#F7941D" stop-opacity=".1"/><stop offset=".35" stop-color="#F7941D"/><stop offset=".7" stop-color="#A04EDB"/><stop offset="1" stop-color="#A04EDB" stop-opacity=".1"/></linearGradient></defs>
<style>
text{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.reveal{animation:reveal .9s cubic-bezier(.22,.61,.36,1) backwards}
.r1{animation-delay:.1s}.r2{animation-delay:.3s}.r3{animation-delay:.55s}.r4{animation-delay:.7s}.r5{animation-delay:.85s}.r6{animation-delay:1s}.r7{animation-delay:1.25s}.r8{animation-delay:1.4s}
.ascii{font-family:ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',monospace}
@keyframes reveal{from{opacity:.18;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
@keyframes drift{to{stroke-dashoffset:-220}}
@keyframes breathe{0%,100%{opacity:.5}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){.reveal{animation:none;opacity:1;transform:none}}

.pipeline-stage{animation:stage 8s linear infinite}.phase-1{animation-delay:-6s}.phase-2{animation-delay:-4s}.phase-3{animation-delay:-2s}
.pipeline-packet{stroke-dasharray:13 90;animation:packet 8s linear infinite}.packet-1{animation-delay:-6s}.packet-2{animation-delay:-4s}
@keyframes stage{0%,22%{opacity:1}28%,94%{opacity:.52}100%{opacity:1}}
@keyframes packet{0%,3%{stroke-dashoffset:98;opacity:0}6%{opacity:1}24%{stroke-dashoffset:0;opacity:1}28%,100%{stroke-dashoffset:0;opacity:0}}
@media(prefers-reduced-motion:reduce){.pipeline-stage,.pipeline-packet{animation:none;opacity:1}.pipeline-packet{stroke-dasharray:4 10;stroke-dashoffset:0;opacity:.45}}
</style><rect width="1200" height="400" fill="#FFFFFF"/>
<text class="reveal r1" x="32" y="43" fill="#6C2F9B" font-size="28" font-weight="650">University AI Student Organization.</text>
<text class="reveal r2" x="32" y="81" fill="#15161B" font-size="28" font-weight="650">A place to learn together and build something that matters.</text>
<text class="reveal r3" x="32" y="135" fill="#373A44" font-size="20">UniAI is a student-led AI initiative in Greece, connecting academic research, practical AI</text>
<text class="reveal r4" x="32" y="164" fill="#373A44" font-size="20">engineering and community innovation. We bring students from different universities and</text>
<text class="reveal r5" x="32" y="193" fill="#373A44" font-size="20">disciplines into a shared space for experiments, hands-on learning and collaboration with</text>
<text class="reveal r6" x="32" y="222" fill="#373A44" font-size="20">researchers and industry.</text>
<text class="reveal r7" x="32" y="278" fill="#373A44" font-size="20">Curiosity is the starting point. Reproducible work, useful tools and knowledge shared with</text>
<text class="reveal r8" x="32" y="307" fill="#373A44" font-size="20">the next student are how we turn it into progress.</text>
<g aria-hidden="true" data-artwork="uniai-idea-pipeline">
<g class="pipeline-stage phase-0" transform="translate(32 350)"><g stroke="#F7941D" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M3 4V1H0M18 4V1h3M3 17v3H0M18 17v3h3"/><path d="M8 7a3 3 0 1 1 4 2.8c-1 .5-1.5 1.1-1.5 2.2"/><circle cx="10.5" cy="16" r=".8" fill="#F7941D" stroke="none"/></g><text class="ascii" x="36" y="13" font-size="12" font-weight="650" letter-spacing="2" fill="#F7941D">ASK</text><text class="ascii" x="36" y="31" font-size="10" letter-spacing="1.5" fill="#6C707C">[?]</text></g>
<path d="M198 361H298" stroke="#6C2F9B" stroke-width=".8" opacity=".23"/><path class="pipeline-packet packet-0" d="M198 361H298" stroke="#F7941D" stroke-width="1.8"/><path d="M293 358L298 361L293 364" stroke="#6C2F9B" stroke-width="1" opacity=".65"/>
<g class="pipeline-stage phase-1" transform="translate(326 350)"><g stroke="#6C2F9B" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M4 4h5l6 6h5M9 4l6 13h5M4 4v13h5"/><circle cx="3" cy="4" r="2"/><circle cx="20" cy="10" r="2"/><circle cx="20" cy="17" r="2"/></g><text class="ascii" x="36" y="13" font-size="12" font-weight="650" letter-spacing="2" fill="#6C2F9B">THINK</text><text class="ascii" x="36" y="31" font-size="10" letter-spacing="1.5" fill="#6C707C">{ .. }</text></g>
<path d="M492 361H592" stroke="#6C2F9B" stroke-width=".8" opacity=".23"/><path class="pipeline-packet packet-1" d="M492 361H592" stroke="#6C2F9B" stroke-width="1.8"/><path d="M587 358L592 361L587 364" stroke="#6C2F9B" stroke-width="1" opacity=".65"/>
<g class="pipeline-stage phase-2" transform="translate(620 350)"><g stroke="#F7941D" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M4 5L18 4L18 17L4 16L4 5L18 17M18 4L4 16"/><circle cx="4" cy="5" r="2"/><circle cx="18" cy="4" r="2"/><circle cx="18" cy="17" r="2"/><circle cx="4" cy="16" r="2"/></g><text class="ascii" x="36" y="13" font-size="12" font-weight="650" letter-spacing="2" fill="#F7941D">CONNECT</text><text class="ascii" x="36" y="31" font-size="10" letter-spacing="1.5" fill="#6C707C">&lt; + &gt;</text></g>
<path d="M786 361H886" stroke="#6C2F9B" stroke-width=".8" opacity=".23"/><path class="pipeline-packet packet-2" d="M786 361H886" stroke="#F7941D" stroke-width="1.8"/><path d="M881 358L886 361L881 364" stroke="#6C2F9B" stroke-width="1" opacity=".65"/>
<g class="pipeline-stage phase-3" transform="translate(914 350)"><g stroke="#6C2F9B" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M11 0L20 6L18 17L7 21L0 12L3 3Z"/><path d="M3 3L8 8L15 6L18 13L10 17L5 13L8 8M11 0L15 6L20 6M18 17L18 13M7 21L10 17M0 12L5 13"/></g><text class="ascii" x="36" y="13" font-size="12" font-weight="650" letter-spacing="2" fill="#6C2F9B">CREATE</text><text class="ascii" x="36" y="31" font-size="10" letter-spacing="1.5" fill="#6C707C">[idea]</text></g>
</g>
</svg>
