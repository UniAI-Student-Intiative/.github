<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" fill="none" role="img" aria-labelledby="title description">
<title id="title">UniAI mission and identity</title>
<desc id="description">University AI Student Organization. A place to learn together and build something that matters. UniAI is a student-led AI initiative in Greece, connecting academic research, practical AI engineering and community innovation. We bring students from different universities and disciplines into a shared space for experiments, hands-on learning and collaboration with researchers and industry. Curiosity is the starting point. Reproducible work, useful tools and knowledge shared with the next student are how we turn it into progress. The decorative ASCII constellation represents ideas connecting.</desc>
<defs><linearGradient id="signal" x1="32" y1="0" x2="1168" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#F7941D" stop-opacity=".1"/><stop offset=".35" stop-color="#F7941D"/><stop offset=".7" stop-color="#A04EDB"/><stop offset="1" stop-color="#A04EDB" stop-opacity=".1"/></linearGradient></defs>
<style>
text{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.reveal{animation:reveal .9s cubic-bezier(.22,.61,.36,1) backwards}
.r1{animation-delay:.1s}.r2{animation-delay:.3s}.r3{animation-delay:.55s}.r4{animation-delay:.7s}.r5{animation-delay:.85s}.r6{animation-delay:1s}.r7{animation-delay:1.25s}.r8{animation-delay:1.4s}
.ascii{font-family:ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',monospace}
.signal{stroke-dasharray:4 18;animation:drift 12s linear infinite}
.beacon{animation:breathe 6s ease-in-out infinite}
.offset{animation-delay:-3s}
@keyframes reveal{from{opacity:.18;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
@keyframes drift{to{stroke-dashoffset:-220}}
@keyframes breathe{0%,100%{opacity:.5}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){.reveal,.signal,.beacon{animation:none;opacity:1;transform:none}}
</style>
<text class="reveal r1" x="32" y="43" fill="#C493EC" font-size="28" font-weight="650">University AI Student Organization.</text>
<text class="reveal r2" x="32" y="81" fill="#F6F6F4" font-size="28" font-weight="650">A place to learn together and build something that matters.</text>
<text class="reveal r3" x="32" y="135" fill="#D9D9E0" font-size="20">UniAI is a student-led AI initiative in Greece, connecting academic research, practical AI</text>
<text class="reveal r4" x="32" y="164" fill="#D9D9E0" font-size="20">engineering and community innovation. We bring students from different universities and</text>
<text class="reveal r5" x="32" y="193" fill="#D9D9E0" font-size="20">disciplines into a shared space for experiments, hands-on learning and collaboration with</text>
<text class="reveal r6" x="32" y="222" fill="#D9D9E0" font-size="20">researchers and industry.</text>
<text class="reveal r7" x="32" y="278" fill="#D9D9E0" font-size="20">Curiosity is the starting point. Reproducible work, useful tools and knowledge shared with</text>
<text class="reveal r8" x="32" y="307" fill="#D9D9E0" font-size="20">the next student are how we turn it into progress.</text>
<g aria-hidden="true">
<path d="M48 364H1152" stroke="url(#signal)" stroke-width="1" opacity=".22"/>
<path class="signal" d="M48 364H1152" stroke="url(#signal)" stroke-width="1.4" opacity=".6"/>
<text class="ascii beacon " x="32" y="369" font-size="14" fill="#F7941D" letter-spacing="1">[ . ]</text>
<text class="ascii beacon offset" x="268" y="369" font-size="14" fill="#C493EC" letter-spacing="1">&lt; + &gt;</text>
<text class="ascii beacon " x="558" y="369" font-size="14" fill="#F7941D" letter-spacing="1">{ * }</text>
<text class="ascii beacon offset" x="848" y="369" font-size="14" fill="#C493EC" letter-spacing="1">&lt; + &gt;</text>
<text class="ascii beacon " x="1118" y="369" font-size="14" fill="#F7941D" letter-spacing="1">[ . ]</text>
</g>
</svg>
