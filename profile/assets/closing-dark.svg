<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="210" viewBox="0 0 1200 210" role="img" aria-labelledby="title desc" fill="none"><title id="title">Your next idea belongs here.</title><desc id="desc">A closing invitation to learn, build and connect with UniAI. Choose the membership updates, featured work or workshop proposal links below.</desc><style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.spark{animation:breathe 7s ease-in-out infinite}@keyframes breathe{50%{opacity:.35}}@media(prefers-reduced-motion:reduce){.spark{animation:none}}</style><rect width="1200" height="210" fill="#0D1117"/><path d="M70 35H1130" stroke="#A04EDB" opacity=".2"/><text x="600" y="68" class="mono" text-anchor="middle" font-size="11" letter-spacing="2" fill="#B6B6C1">THE NEXT DISCOVERY STARTS WITH YOU</text><text x="600" y="123" text-anchor="middle" font-size="43" font-weight="750" letter-spacing="-1.3" fill="#F6F6F4">Your next idea <tspan fill="#A04EDB">belongs here.</tspan></text><text x="600" y="166" text-anchor="middle" font-size="16" fill="#B6B6C1">Bring your curiosity. Find your people. Build something together.</text><g class="spark" stroke="#F7941D"><path d="M73 120h16m-8-8v16M1111 120h16m-8-8v16"/></g></svg>
